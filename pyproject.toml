[project]
name = "smartclinic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "phamkhai108", email = "phamkhai8100@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.3.0",
    "docling>=2.114.0",
    "elasticsearch>=8.17.2",
    "fastapi[standard]>=0.115.11",
    "just>=0.8.162",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "numpy>=2.2.4",
    "onnxruntime>=1.27.0",
    "openai>=1.72.0",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "pydantic-settings>=2.8.1",
    "pyjwt>=2.10.1",
    "pymilvus>=3.0.0",
    "pymupdf>=1.25.5",
    "scikit-learn>=1.6.1",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.2",
]
